name: CI - Build e Testes

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build e Verificação
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala as dependências
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Lint — verifica qualidade e estilo do código
      - name: Lint com flake8
        run: |
          flake8 app/ tests/ --max-line-length=100 --statistics

      # 5. Testes — roda todos os testes e gera relatório de cobertura
      - name: Rodar testes com pytest
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing

      # 6. Exibe resumo no log do Actions
      - name: Resumo do build
        run: echo "✅ Build concluído com sucesso!"
